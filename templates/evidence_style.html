<style>
:root{--ink:#153633;--muted:#526660;--paper:#f7f8f2;--line:#d6dfd5;--green:#165c48;--tint:#e8efe3;--lime:#d7eea5;--white:#fff;--amber:#83581d;--rose:#973d35}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 "Segoe UI",system-ui,sans-serif}a{color:var(--green);text-underline-offset:4px}a:hover{color:#081f18}button,input,select{font:inherit}a,button,input,summary,[tabindex]{scroll-margin-top:20px}:focus-visible{outline:3px solid #b75a12;outline-offset:4px}.skip{position:absolute;left:16px;top:-100px;padding:12px;background:white;z-index:10}.skip:focus{top:10px}
.masthead{background:#132f2b;color:white}.header-inner{max-width:1280px;margin:auto;padding:18px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{display:flex;align-items:center;gap:10px;color:white;font-weight:750;letter-spacing:-.5px;text-decoration:none;white-space:nowrap}.brand-mark{display:grid;place-items:center;width:32px;height:32px;background:var(--lime);color:var(--ink);border-radius:8px;font-size:23px;line-height:1}nav{display:flex;align-items:center;gap:22px;flex-wrap:wrap}nav a{color:#d4e4dc;font-size:13px;text-decoration:none;padding:6px 0}nav a:hover,nav a[aria-current]{color:var(--lime)}nav a[aria-current]{border-bottom:2px solid var(--lime)}nav .nav-workspace{padding:7px 12px;border:1px solid #526d62;border-radius:6px}
main{max-width:1200px;margin:auto;padding:48px 32px 24px}.eyebrow{color:var(--green);font-weight:700;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;margin:0 0 12px}h1,h2,h3{line-height:1.15;letter-spacing:-1px;margin:0}h1{font-size:clamp(34px,4.7vw,59px);max-width:860px}h2{font-size:27px}h3{font-size:19px;letter-spacing:-.4px}p{margin:12px 0 0}.intro{max-width:660px;color:var(--muted);font-size:18px}.page-head{margin-bottom:32px}.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:48px;align-items:center;margin-bottom:48px}.hero h1{font-size:clamp(38px,5vw,67px);letter-spacing:-2px}.hero .intro{margin-top:22px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.button,button{border:1px solid var(--green);background:var(--green);color:white;padding:11px 18px;border-radius:7px;text-decoration:none;font-weight:650;cursor:pointer;display:inline-block}.button:hover,button:hover{color:white;background:#103e31}.button.secondary{background:transparent;color:var(--green)}.tag{display:inline-block;border:1px solid var(--line);padding:3px 9px;border-radius:5px;font-size:12px;letter-spacing:0;background:var(--paper);font-weight:600}.tag.good{background:#e7f3df;color:#285921;border-color:#bdcdb6}.tag.warn{background:#fff3d7;color:var(--amber);border-color:#e8d7b3}.tag.bad{background:#f9e9e4;color:var(--rose);border-color:#e8cfc7}
.card{background:white;border:1px solid var(--line);border-radius:13px;padding:26px;min-width:0}.featured{background:#edf3e5}.section{margin-top:36px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.section-head p{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.grid.three{grid-template-columns:repeat(3,1fr)}.small{font-size:13px;color:var(--muted)}.label{display:block;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px}.rule{border-top:1px solid var(--line);margin-top:20px;padding-top:18px}.quiet{color:var(--muted)}blockquote{white-space:pre-line;border-left:3px solid #aabf97;padding:4px 0 4px 18px;margin:18px 0;font-size:20px;line-height:1.5;overflow-wrap:anywhere}.deleted{background:#fcf0ea}.added{background:#eef5e7}.status-change{display:flex;gap:12px;align-items:center;margin:16px 0;font-size:24px;font-weight:650}.pipeline{display:grid;gap:12px}.pipeline>div{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}.pipeline>div:last-child{border:0}.node{height:27px;width:27px;border:1px solid #8ca87f;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:bold;background:white}.metric{font-size:39px;line-height:1.2;letter-spacing:-1.5px;font-weight:700;display:block;margin:12px 0}.metric small{font-size:19px;color:var(--muted)}.scroll{overflow:auto;border-radius:9px;border:1px solid var(--line)}table{border-collapse:collapse;background:white;width:100%;font-size:14px}th{font-weight:650;background:#edf1e8;color:#3d5547}th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border:0}td:first-child{min-width:120px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 ui-monospace,monospace;background:#edf1e8;padding:16px;border-radius:8px}code,.hash{font:12px/1.6 ui-monospace,monospace;overflow-wrap:anywhere}.callout{border-left:3px solid #a8bf79;padding:16px 20px;background:#edf3e5;border-radius:0 8px 8px 0;margin-top:20px}.callout.warning{background:#fff5e1;border-color:#cda66d}.detail{margin-top:16px}.detail summary{cursor:pointer;font-weight:600;padding:8px 0}.search{display:flex;gap:10px;align-items:end;margin:20px 0}.search>div{flex:1}.search label{display:block;font-weight:600;margin-bottom:6px}input{padding:11px 14px;border:1px solid #a2b3a4;border-radius:6px;background:white;width:100%;min-width:0}.lead{margin-bottom:16px}.break{overflow-wrap:anywhere}footer{margin-top:54px;padding:24px 0;border-top:1px solid var(--line);display:flex;gap:20px;flex-wrap:wrap;font-size:12px;color:var(--muted)}footer span{margin-right:auto}.pending{background:#f0f1eb}

</style>
