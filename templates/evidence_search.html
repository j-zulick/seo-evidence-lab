<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence search</title><style>body{max-width:800px;margin:2rem auto;padding:1rem;font:18px/1.6 system-ui}code{overflow-wrap:anywhere}</style><a href="/qa/competitors">Back to timeline</a><h1>Search source passages</h1><form><label for="q">Search the synthetic corpus</label> <input name="q" id="q" maxlength="512" value="{{query}}"><button>Search</button></form>{% for hit in hits %}<article><h2>{{hit.source}} · version {{hit.version}}</h2><blockquote>{{hit.passage}}</blockquote><small>Passage {{hit.id}} · <code>{{hit.sha256}}</code></small></article>{% else %}{% if query %}<p>No matching evidence.</p>{% endif %}{% endfor %}</html>
