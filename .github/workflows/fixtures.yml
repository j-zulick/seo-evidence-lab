name: Local fixtures
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ./setup/bootstrap_local.sh
      - run: ./setup/fixture_ci.sh
