name: Release
# Agents never push tags or upload assets. Merging docs/releases/vX.Y.Z.md into main
# makes this workflow tag and publish that version after fixture CI passes on the
# released commit. Optional first-lines marker in the notes:
#   <!-- release-commit: <full sha> -->   (must already be on main; default: this push's commit)
on:
  push:
    branches: [main]
    paths: ['docs/releases/v*.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select version and guard
        id: pick
        env:
          PAUSED: ${{ vars.RELEASES_PAUSED }}
        run: |
          set -eu
          if [ "${PAUSED:-}" = "true" ]; then echo "Releases are paused (repo variable RELEASES_PAUSED)"; exit 1; fi
          git fetch -q --tags origin
          NEW=""
          for f in docs/releases/v*.md; do
            t=$(basename "$f" .md)
            echo "$t" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Bad notes name $f"; exit 1; }
            git rev-parse -q --verify "refs/tags/$t" >/dev/null || NEW="$NEW $t"
          done
          set -- $NEW
          if [ $# -eq 0 ]; then echo "Nothing new to release"; echo "tag=" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ $# -eq 1 ] || { echo "More than one unreleased notes file:$NEW"; exit 1; }
          TAG=$1; NOTES="docs/releases/$TAG.md"
          if grep -nE 'FILL|TODO|TBD' "$NOTES"; then echo "Unfilled placeholder in $NOTES"; exit 1; fi
          grep -q '^## Boundaries' "$NOTES" || { echo "$NOTES needs a Boundaries section"; exit 1; }
          SHA=$(sed -n 's/^<!-- release-commit: \([0-9a-f]\{40\}\) -->$/\1/p' "$NOTES" | head -1)
          SHA=${SHA:-$GITHUB_SHA}
          git merge-base --is-ancestor "$SHA" "$GITHUB_SHA" || { echo "$SHA is not on main"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"; echo "sha=$SHA" >> "$GITHUB_OUTPUT"; echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
          cp "$NOTES" "$RUNNER_TEMP/notes.md"
      - name: Check out released commit
        if: steps.pick.outputs.tag != ''
        run: git checkout -q "${{ steps.pick.outputs.sha }}"
      - uses: actions/setup-python@v6
        if: steps.pick.outputs.tag != ''
        with:
          python-version: '3.12'
      - if: steps.pick.outputs.tag != ''
        run: ./setup/bootstrap_local.sh && ./setup/fixture_ci.sh
      - name: Tag, publish and read back
        if: steps.pick.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pick.outputs.tag }}
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          set -eu
          ZIP="seo-evidence-lab-$TAG-source.zip"
          git archive --format=zip -o "$ZIP" "$SHA"
          sha256sum "$ZIP" > SHA256SUMS
          { sed '/^<!-- release-commit:/d' "$RUNNER_TEMP/notes.md"; echo; echo "---"
            echo "Commit: \`$SHA\` · CI: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Source ZIP SHA256: \`$(cut -d' ' -f1 SHA256SUMS)\`"; } > notes.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SHA" -m "SEO Evidence Lab $TAG"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md "$ZIP" SHA256SUMS
          sleep 5
          curl -fsSL -o /tmp/check.zip "${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/$ZIP"
          echo "$(cut -d' ' -f1 SHA256SUMS)  /tmp/check.zip" | sha256sum -c -
